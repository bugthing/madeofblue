name: Agent plugin tests

on:
  pull_request:
    paths:
      - "build_files/**"
      - "disk_config/**"
      - "scripts/**"
      - "system_files/**"
      - "tests/agent/**"
      - ".github/workflows/agent-tests.yml"
  push:
    branches: [main]
    paths:
      - "build_files/**"
      - "disk_config/**"
      - "scripts/**"
      - "system_files/**"
      - "tests/agent/**"
      - ".github/workflows/agent-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Luau
        run: |
          curl -fsSL -o "$RUNNER_TEMP/luau.zip" https://github.com/luau-lang/luau/releases/download/0.745/luau-ubuntu.zip
          unzip -q "$RUNNER_TEMP/luau.zip" -d "$RUNNER_TEMP/luau"
          echo "$RUNNER_TEMP/luau" >> "$GITHUB_PATH"

      - name: Run unit tests
        run: luau tests/agent/run.luau

      - name: Validate TOML
        run: |
          python3 - <<'EOF'
          import glob, tomllib
          paths = sorted(
              glob.glob("disk_config/*.toml")
              + glob.glob("system_files/**/*.toml", recursive=True, include_hidden=True)
          )
          assert paths, "no TOML files found"
          for path in paths:
              with open(path, "rb") as f:
                  tomllib.load(f)
              print("ok", path)
          EOF

      - name: Shellcheck scripts
        run: |
          shellcheck build_files/*.sh scripts/*.sh \
            system_files/usr/bin/madeofblue-screensaver \
            system_files/usr/libexec/madeofblue/docker-group
