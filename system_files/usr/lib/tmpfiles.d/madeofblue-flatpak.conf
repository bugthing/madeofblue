# System-wide Flatpak overrides shipped by the image.
# /var is persistent across bootc updates, so C+ copies declarative overrides
# from /usr/share into /var/lib/flatpak/overrides on every boot.
d /var/lib/flatpak 0755 root root -
d /var/lib/flatpak/overrides 0755 root root -
C+ /var/lib/flatpak/overrides/com.bitwarden.desktop 0644 root root - /usr/share/madeofblue/flatpak/overrides/com.bitwarden.desktop
z /var/lib/flatpak/overrides/com.bitwarden.desktop 0644 root root -
