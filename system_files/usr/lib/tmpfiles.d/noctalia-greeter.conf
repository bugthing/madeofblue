# State dir for the Noctalia greeter (greeter.toml, sync.toml, wallpapers).
# Upstream's rule hardcodes a "greeter" user; Fedora's greetd RPM runs the
# greeter as "greetd" (see system_files/etc/greetd/config.toml).
# C+ copies the declarative greeter.toml from /usr/share on every boot (since
# /var is persistent across bootc updates) while leaving sync.toml untouched.
d /var/lib/noctalia-greeter 0750 greetd greetd -
C+ /var/lib/noctalia-greeter/greeter.toml 0644 greetd greetd - /usr/share/madeofblue/noctalia-greeter/greeter.toml
z /var/lib/noctalia-greeter/greeter.toml 0644 greetd greetd -
