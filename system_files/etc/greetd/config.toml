# Overrides the RPM-shipped default (which points at agreety, greetd's plain
# text fallback greeter) to use the Noctalia greeter instead. It presents a
# session picker over the standard *.desktop entries under
# /usr/share/wayland-sessions/, so both the GNOME session (from bluefin-dx)
# and Niri show up here.
#
# The "greetd" user below is the system account Fedora's greetd RPM creates
# via /usr/lib/sysusers.d/greetd.conf. Upstream Noctalia greeter docs default
# to a "greeter" user, which does not exist on Fedora.

[terminal]
vt = 1

[default_session]
command = "/usr/bin/noctalia-greeter-session"
user = "greetd"
