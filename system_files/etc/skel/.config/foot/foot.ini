# Default Foot terminal configuration for MadeOfBlue.
# Users can edit this at ~/.config/foot/foot.ini.

[main]
font=JetBrains Mono:size=11
pad=10x10
initial-color-theme=dark

[cursor]
style=block
blink=no

[colors-dark]
alpha=0.88
background=0c1017
foreground=e6edf7

# Normal ANSI colors (matched to the MadeOfBlue workshop palette)
regular0=0c1017
regular1=e03c44
regular2=3ee084
regular3=f0b44c
regular4=2565e8
regular5=8c6cf7
regular6=38b4fc
regular7=c8d4e6

# Bright ANSI colors
bright0=3a475c
bright1=f25c64
bright2=62f0a0
bright3=f8ca6e
bright4=4d88ff
bright5=a88eff
bright6=68cbff
bright7=f0f6ff

selection-foreground=071320
selection-background=38b4fc
